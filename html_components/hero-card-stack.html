<div class="card-stack-stage">
  <div class="card-stack" id="cardStack">
    <!-- Cards generated dynamically from data/experiences.json -->
  </div>
  <div class="card-skeleton hidden" id="cardSkeleton">
    <div class="skeleton-card"></div>
    <div class="skeleton-card skeleton-card--mid"></div>
    <div class="skeleton-card skeleton-card--back"></div>
  </div>
  <div class="gift-box hidden" id="giftBox">
    <div class="gift-box__icon">🎁</div>
    <h3 class="gift-box__title">Your Gift Pack is Ready!</h3>
    <p class="gift-box__subtitle">You've selected 5 amazing experiences</p>
    <div class="gift-box__cards" id="selectedCards"></div>
    <a
      class="btn gift-box__cta"
      href="mailto:info@laskaway.com?subject=Send%20my%20Gift%20Pack&body=Hi%20Laskaway%2C%0A%0AI%27m%20ready%20to%20send%20this%20gift%20pack.%20Let%20me%20know%20the%20next%20steps.%0A"
    >
      Send Gift Pack
    </a>
  </div>
</div>
<div class="drag-hint" id="dragHint" role="note" aria-live="polite">
  <span class="drag-hint__arrow drag-hint__arrow--left" aria-hidden="true">←</span>
  <span class="drag-hint__text">Drag cards</span>
  <span class="drag-hint__arrow drag-hint__arrow--right" aria-hidden="true">→</span>
</div>
