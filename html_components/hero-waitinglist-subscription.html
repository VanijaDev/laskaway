<div class="container hero__grid">
  <div class="hero__copy">
    <h1 class="hero__title">
      <span class="accent">Live</span> the Gift
    </h1>
    <p class="hero__subtitle">
      Explore unforgettable, handpicked experiences and make gifting exciting — join the waitlist for early access.
    </p>

    <form id="waitlist-form" class="waitlist" novalidate>
      <div class="waitlist__controls">
        <div class="input-wrapper">
          <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder=" " required aria-describedby="emailHelp" />
          <label for="email" class="floating-label">Email address</label>
          <div class="input-icons">
            <span class="validation-icon validation-icon--valid" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="2"/>
                <path d="M6 10l3 3 5-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </div>
        </div>
        <button id="joinBtn" type="submit" class="btn btn--primary">Join Waitlist</button>
      </div>
      <div id="emailHelp" class="help">No spam — just a friendly launch note.</div>
    </form>

    <div id="successState" class="success hidden" role="status" aria-live="polite">
      <div class="success__icon" aria-hidden="true">✅</div>
      <h2 class="success__title">You're in!</h2>
      <p class="success__body">Thanks for joining — we can't wait to surprise and delight. We'll email you when we launch.</p>
    </div>
  </div>

  <div class="hero__visual" id="heroVisual">
    <!-- Component loaded dynamically from html_components/hero-card-stack.html -->
  </div>
</div>
